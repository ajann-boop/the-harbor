<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Harbor - All-Abilities & Inclusive Family Network</title>
    <style>
        body { font-family: sans-serif; background: #f4f7f6; color: #333; margin: 0; padding: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; }
        .container { background: white; padding: 40px; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 100%; max-width: 600px; text-align: center; }
        h1 { color: #2b5c8f; margin-bottom: 10px; }
        p { color: #666; margin-bottom: 30px; }
        .form-group { text-align: left; margin-bottom: 20px; }
        label { display: block; font-weight: bold; margin-bottom: 8px; color: #444; }
        input[type="text"] { width: 100%; padding: 12px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 6px; font-size: 1em; }
        button { background: #2b5c8f; color: white; border: none; padding: 12px 25px; border-radius: 6px; font-size: 1em; cursor: pointer; width: 100%; font-weight: bold; }
        button:hover { background: #1f4268; }
        .admin-link { margin-top: 30px; font-size: 0.9em; }
        .admin-link a { color: #888; text-decoration: none; }
    </style>
</head>
<body>
    <div class="container">
        <h1>The Harbor</h1>
        <p>An All-Abilities & Inclusive Family & Caregiver Sanctuary Network</p>

        <!-- Form posts directly to your Flask backend route -->
        <form action="/submit-application" method="POST">
            <div class="form-group">
                <label for="badges_text">Select or Describe Your Caregiver Situation / Badges:</label>
                <input type="text" id="badges_text" name="badges_text" placeholder="e.g., Autism Strong, Terminal Support, Equipment Exchange" required autocomplete="off">
            </div>
            <button type="submit">Submit Membership Application</button>
        </form>

        <div class="admin-link">
            <a href="/admin-login">🔒 Administrator Access Portal</a>
        </div>
    </div>
</body>
</html>
