<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Harbor - Lewie and Marcus Network</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 min-h-screen flex flex-col items-center justify-center p-4">

    <div class="max-w-lg w-full bg-white rounded-xl shadow-md overflow-hidden p-6 space-y-6">
        
        <!-- Canva Ad / Header Photo Banner -->
        <div class="rounded-lg overflow-hidden shadow-inner bg-slate-100 h-40 flex items-center justify-center">
            <img src="{{ url_for('static', filename='canva_banner.jpg') }}" alt="The Harbor Community" class="w-full h-full object-cover">
        </div>

        <!-- Header -->
        <div class="text-center">
            <h2 class="text-2xl font-bold text-slate-800">The Harbor</h2>
            <p class="text-sm text-slate-600 mt-1">Welcome to our community network.</p>
        </div>

        <!-- Learn More / Video Feature Section -->
        <div class="bg-slate-50 rounded-lg p-4 border border-slate-200 space-y-3">
            <div class="flex justify-between items-center">
                <span class="text-xs font-semibold uppercase tracking-wider text-slate-500">Learn More About What We're Doing</span>
                <button type="button" onclick="toggleVideoPlayer()" class="text-xs text-sky-600 hover:underline font-medium">Watch Video</button>
            </div>
            
            <!-- Embed Video Container (hidden by default or toggleable) -->
            <div id="video-container" class="hidden aspect-w-16 aspect-h-9 rounded-md overflow-hidden bg-black">
                <!-- Replace src with your hosted video link or YouTube embed URL -->
                <iframe class="w-full h-48 rounded" src="https://www.youtube.com/embed/YOUR_VIDEO_ID" title="The Harbor Overview" frameborder="0" allowfullscreen></iframe>
            </div>
        </div>

        <!-- Registration & Sign-In Form -->
        <form action="/join" method="POST" class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-slate-700">Full Name</label>
                <input type="text" name="name" required class="mt-1 block w-full rounded-md border border-slate-300 p-2 shadow-sm focus:border-sky-500 focus:ring-sky-500 sm:text-sm" placeholder="Your Name">
            </div>
            
            <div>
                <label class="block text-sm font-medium text-slate-700">Email Address</label>
                <input type="email" name="email" required class="mt-1 block w-full rounded-md border border-slate-300 p-2 shadow-sm focus:border-sky-500 focus:ring-sky-500 sm:text-sm" placeholder="your@email.com">
            </div>

            <!-- Contributor Buttons -->
            <div class="pt-2 flex flex-col sm:flex-row gap-3">
                <button type="button" onclick="toggleContributionOptions()" class="flex-1 bg-slate-100 border border-slate-300 text-slate-700 font-medium py-2 px-4 rounded-md hover:bg-slate-200 transition text-sm">
                    Individual Contributors
                </button>
                <button type="button" onclick="toggleContributionOptions()" class="flex-1 bg-slate-100 border border-slate-300 text-slate-700 font-medium py-2 px-4 rounded-md hover:bg-slate-200 transition text-sm">
                    Business Contributors
                </button>
            </div>

            <!-- Hidden / Toggleable Anonymity Section -->
            <div id="contribution-options" class="hidden mt-4 p-4 bg-slate-50 rounded-md border border-slate-200 space-y-3">
                <p class="text-xs text-slate-600 font-medium">Would you like your contribution to remain anonymous?</p>
                <div class="flex items-center space-x-4">
                    <label class="flex items-center text-sm text-slate-700">
                        <input type="radio" name="is_anonymous" value="yes" class="mr-2"> Yes, stay anonymous
                    </label>
                    <label class="flex items-center text-sm text-slate-700">
                        <input type="radio" name="is_anonymous" value="no" checked class="mr-2"> No, display my name
                    </label>
                </div>
            </div>

            <!-- Dual Action Buttons -->
            <div class="pt-2 space-y-3">
                <button type="submit" formaction="/join" class="w-full bg-sky-500 text-white font-semibold py-2 px-4 rounded-md hover:bg-sky-600 transition shadow-sm text-sm">
                    Join Now — If you haven't already
                </button>
                <button type="submit" formaction="/signin" class="w-full bg-slate-200 text-slate-700 font-semibold py-2 px-4 rounded-md hover:bg-slate-300 transition shadow-sm text-sm">
                    Sign In — To connect to your community
                </button>
            </div>
        </form>
    </div>

    <script>
    function toggleContributionOptions() {
        const box = document.getElementById('contribution-options');
        box.classList.toggle('hidden');
    }
    function toggleVideoPlayer() {
        const videoBox = document.getElementById('video-container');
        videoBox.classList.toggle('hidden');
    }
    </script>
</body>
</html>
